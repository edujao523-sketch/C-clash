<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ANIME CLASH — Vortex vs Nero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;z-index:3;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}.fighter{font-weight:1000;letter-spacing:.14em;font-size:clamp(11px,2.8vw,17px);text-shadow:0 2px 8px #000}.fighter.r{text-align:right}.bar{height:14px;margin-top:6px;background:#171c2c;border:1px solid #ffffff88;transform:skewX(-12deg);overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#00a9d7,#75f6ff);transition:width .12s}.r .fill{background:linear-gradient(90deg,#ff9a45,#ff315e)}#timer{font-size:clamp(24px,6vw,40px);font-weight:1000;text-shadow:0 2px 10px #000}#round{font-size:9px;letter-spacing:.18em;text-align:center;color:#c6d5f0}
#controls{position:fixed;z-index:4;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}#move{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #ffffff88;color:white;background:#14243bdf;font-weight:900;touch-action:none;box-shadow:0 5px 20px #0009}button:active{transform:scale(.94)}.move{width:clamp(53px,14vw,70px);height:clamp(53px,14vw,70px);border-radius:50%;font-size:20px}.atk{width:clamp(58px,15vw,76px);height:clamp(58px,15vw,76px);border-radius:50%;font-size:clamp(9px,2.5vw,12px);background:radial-gradient(circle at 30% 20%,#45dfff,#12416e);box-shadow:0 0 20px #18cfff66}.heavy{background:radial-gradient(circle at 30% 20%,#ff9d67,#8e173b);box-shadow:0 0 20px #ff3b6766}.special{width:clamp(80px,20vw,108px);height:48px;border-radius:25px;background:linear-gradient(90deg,#6938d9,#d52e8a);font-size:10px}
#overlay{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#172b4edb,#050713f5 70%)}#card{width:min(480px,94vw);padding:28px 22px;text-align:center;border:1px solid #66dfff77;border-radius:22px;background:linear-gradient(145deg,#14213bea,#090e1eee);box-shadow:0 20px 90px #000c,0 0 45px #1bcfff22}.logo{font-size:clamp(38px,10vw,62px);font-weight:1000;font-style:italic;letter-spacing:-.07em;line-height:.9;background:linear-gradient(90deg,#fff,#59eaff 50%,#ff5880);color:transparent;background-clip:text}.tag{margin:12px 0 22px;font-size:10px;letter-spacing:.3em;color:#a9c1e5}#start{padding:15px 30px;border-radius:30px;background:linear-gradient(90deg,#62eaff,#fff,#ff7195);color:#07101d;border:0;letter-spacing:.12em}#introtext{font-size:13px;line-height:1.6;color:#c5d5ee}.small{position:fixed;z-index:5;right:12px;top:76px;padding:9px 12px;border-radius:20px;font-size:10px}#msg{position:fixed;z-index:6;top:40%;width:100%;text-align:center;font-size:clamp(28px,8vw,64px);font-weight:1000;font-style:italic;text-shadow:0 4px 25px #000,0 0 24px #48eaff;opacity:0;transition:.18s;pointer-events:none}#msg.on{opacity:1;transform:scale(1.05)}#energy{position:fixed;z-index:3;bottom:110px;left:14px;width:28vw;max-width:180px;height:5px;background:#22283b;border-radius:5px;overflow:hidden}#energyfill{height:100%;width:0;background:linear-gradient(90deg,#843eff,#ff65d0)}
@media(min-width:800px){#controls{padding:0 5vw}.move{width:70px;height:70px}.atk{width:78px;height:78px}}
</style></head><body>
<div id="hud"><div class="fighter">VORTEX <div class="bar"><div class="fill" id="hp1"></div></div></div><div><div id="timer">99</div><div id="round">ROUND 01 · BEST OF 3</div></div><div class="fighter r">NERO <div class="bar"><div class="fill" id="hp2"></div></div></div></div>
<div id="energy"><div id="energyfill"></div></div><button class="small" id="pause">Ⅱ PAUSAR</button><div id="msg"></div>
<div id="controls"><div id="move"><button class="move" data-m="left">◀</button><button class="move" data-m="right">▶</button><button class="move" data-m="jump">↑</button></div><div id="move"><button class="atk" id="light">SOCO</button><button class="atk heavy" id="heavy">PESO</button><button class="special" id="special">✦ ESPECIAL</button></div></div>
<div id="overlay"><div id="card"><div class="logo">ANIME<br>CLASH</div><div class="tag">ARENA ZERO · COMBATE 3D</div><div id="introtext"><b style="color:#50eaff">VORTEX</b> — unidade de combate VX-07<br>contra<br><b style="color:#ff6588">NERO</b> — caçador aprimorado<br><br>Use os controles na tela. Encha a barra roxa acertando golpes para liberar o especial.</div><br><button id="start">INICIAR COMBATE</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b19);scene.fog=new THREE.FogExp2(0x070b19,.026);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,5.8,13.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bcaff,0x191126,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(-5,10,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
for(const [c,x] of [[0x16dfff,-5],[0xff315e,5]]){const l=new THREE.PointLight(c,28,18);l.position.set(x,4,-3);scene.add(l)}
const mat=(c,m=0,r=.45,e=0)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,emissive:c,emissiveIntensity:e});
const floor=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,.45,80),mat(0x111a2d,.6,.5));floor.position.y=-.25;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(8,.055,10,120),new THREE.MeshBasicMaterial({color:0x29cbe9}));ring.rotation.x=Math.PI/2;ring.position.y=.01;scene.add(ring);
const grid=new THREE.GridHelper(40,40,0x23476e,0x14233e);grid.position.y=-.015;scene.add(grid);
for(let i=0;i<16;i++){let a=i/16*Math.PI*2,h=2+Math.random()*4;let p=new THREE.Mesh(new THREE.BoxGeometry(.18,h,.18),mat(i%2?0x173251:0x38234d,.7,.3,.3));p.position.set(Math.cos(a)*10,h/2-.2,Math.sin(a)*10);scene.add(p)}
function box(g,m,p,s,par){const o=new THREE.Mesh(g,m);o.position.set(...p);o.scale.set(...s);o.castShadow=true;o.receiveShadow=true;par.add(o);return o}
function ball(m,p,s,par){return box(new THREE.SphereGeometry(1,20,16),m,p,s,par)}
function capsule(m,p,r,h,par){const o=new THREE.Mesh(new THREE.CapsuleGeometry(r,h,6,12),m);o.position.set(...p);o.castShadow=true;par.add(o);return o}
function makeVortex(x){const root=new THREE.Group();root.position.x=x;scene.add(root);const body=new THREE.Group();root.add(body);const steel=mat(0x303b4d,.9,.28),edge=mat(0x111a2a,.85,.25),blue=new THREE.MeshBasicMaterial({color:0x24dfff}),visor=new THREE.MeshBasicMaterial({color:0xff294f}),glow=new THREE.MeshBasicMaterial({color:0x16dfff,transparent:true,opacity:.16,side:THREE.DoubleSide});
capsule(steel,[0,1.25,0],.4,.65,body);ball(steel,[0,1.95,0],[.39,.42,.34],body);box(new THREE.BoxGeometry(.55,.08,.06),visor,[0,1.99,.34],[1,1,1],body);
for(let s of [-1,1]){ball(edge,[s*.43,1.53,0],[.28,.24,.3],body);capsule(steel,[s*.54,1.17,0],.15,.52,body);ball(edge,[s*.58,.85,.06],[.2,.19,.22],body);capsule(edge,[s*.22,.45,0],.18,.55,body);box(new THREE.BoxGeometry(.35,.16,.55),steel,[s*.22,.12,.1],[1,1,1],body)}
// chest reactor and turbine rings
ball(edge,[0,1.35,.34],[.29,.31,.12],body);const core=ball(blue,[0,1.36,.46],[.17,.17,.07],body);const turbine=new THREE.Mesh(new THREE.TorusGeometry(.28,.035,8,32),blue);turbine.position.set(0,1.36,.39);body.add(turbine);
const cannon=box(new THREE.CylinderGeometry(.19,.25,.58,12),edge,[.58,1.02,.18],[1,1,1],body);cannon.rotation.z=Math.PI/2;const blade=box(new THREE.ConeGeometry(.13,.7,6),steel,[-.65,1.05,.15],[1,1,1],body);blade.rotation.z=-Math.PI/2;
const cape=box(new THREE.BoxGeometry(.65,.95,.08),edge,[0,1.2,-.34],[1,1,1],body);cape.rotation.x=-.12;
const aura=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,2.8,24,1,true),glow);aura.position.y=1.3;body.add(aura);
return {name:'VORTEX',root,body,hp:100,energy:0,attack:0,stun:0,core,turbine,aura,speed:2.5,player:true};}
function makeNero(x){const root=new THREE.Group();root.position.x=x;scene.add(root);const body=new THREE.Group();root.add(body);const skin=mat(0xd69b7d,.05,.7),black=mat(0x10131e,.35,.4),leather=mat(0x242a39,.55,.3),hair=mat(0x080b13,.1,.4),red=new THREE.MeshBasicMaterial({color:0xff3c4e}),fire=new THREE.MeshBasicMaterial({color:0xff681f});
capsule(leather,[0,1.25,0],.35,.65,body);ball(skin,[0,1.98,0],[.32,.39,.3],body);ball(hair,[0,2.23,-.02],[.38,.24,.36],body);
for(let i=0;i<6;i++){const sp=new THREE.Mesh(new THREE.ConeGeometry(.12,.48,6),hair);sp.position.set((i-2.5)*.12,2.45,(i%2)*.08);sp.rotation.z=(i-2.5)*-.2;body.add(sp)}
box(new THREE.BoxGeometry(.13,.045,.04),red,[-.14,2.02,.29],[1,1,1],body);
for(let s of [-1,1]){capsule(s===1?fire:skin,[s*.48,1.22,.02],.12,.5,body);ball(s===1?fire:black,[s*.53,.91,.1],[.17,.17,.18],body);capsule(black,[s*.2,.46,0],.16,.58,body);box(new THREE.BoxGeometry(.35,.15,.5),black,[s*.2,.12,.12],[1,1,1],body)}
// torn jacket tails and glowing gauntlet
for(let s of [-1,1]){const tail=box(new THREE.BoxGeometry(.2,.72,.08),leather,[s*.28,.8,-.27],[1,1,1],body);tail.rotation.z=s*.12}
const glove=ball(fire,[.55,.93,.12],[.22,.24,.2],body);const flame=ball(new THREE.MeshBasicMaterial({color:0xffa52b,transparent:true,opacity:.75}),[.62,1.12,.1],[.13,.28,.13],body);
const aura=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,2.7,24,1,true),new THREE.MeshBasicMaterial({color:0xff315e,transparent:true,opacity:.12,side:THREE.DoubleSide}));aura.position.y=1.3;body.add(aura);
return {name:'NERO',root,body,hp:100,energy:0,attack:0,stun:0,glove,flame,aura,speed:4.3,player:false};}
const vortex=makeVortex(-2.4),nero=makeNero(2.4);let running=false,paused=false,round=1,time=99,shake=0,clock=0;const keys={};const particles=[];
function hud(){document.querySelector('#hp1').style.width=vortex.hp+'%';document.querySelector('#hp2').style.width=nero.hp+'%';document.querySelector('#energyfill').style.width=vortex.energy+'%'}
function say(t){const el=document.querySelector('#msg');el.textContent=t;el.classList.add('on');clearTimeout(say.timer);say.timer=setTimeout(()=>el.classList.remove('on'),850)}
function burst(pos,color,n=18){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.045,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({m,v:new THREE.Vector3(Math.random()-.5,Math.random()*.9,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*4),life:.5})}}
function hit(att,def,power,heavy=false){if(!running||paused||att.attack>0||att.stun>0)return;att.attack=heavy?.65:.32;const d=att.root.position.distanceTo(def.root.position);if(d<(heavy?3.7:2.25)){setTimeout(()=>{if(!running)return;def.hp=Math.max(0,def.hp-power);def.stun=heavy?.38:.18;def.root.position.x+=Math.sign(def.root.position.x-att.root.position.x)*.18;shake=heavy?.3:.12;burst(def.root.position.clone().add(new THREE.Vector3(0,1.3,0)),def===nero?0x24dfff:0xff4c62,heavy?28:15);att.energy=Math.min(100,att.energy+(heavy?18:10));hud();if(def.hp<=0)finish(att.name+' VENCEU');},heavy?230:100)}else{att.energy=Math.min(100,att.energy+3);hud()}}
function special(){if(!running||paused||vortex.energy<60||vortex.attack>0)return;vortex.energy-=60;vortex.attack=.9;say('ULTRA VORTEX');burst(vortex.root.position.clone().add(new THREE.Vector3(0,1.3,0)),0x1bdfff,55);if(vortex.root.position.distanceTo(nero.root.position)<5){nero.hp=Math.max(0,nero.hp-34);nero.stun=.8;shake=.5;burst(nero.root.position.clone().add(new THREE.Vector3(0,1.3,0)),0x25dfff,40);if(nero.hp<=0)finish('VORTEX VENCEU')}hud()}
function finish(t){running=false;say(t);document.querySelector('#start').textContent='JOGAR NOVAMENTE';document.querySelector('#overlay').style.display='flex';document.querySelector('#introtext').innerHTML='<b>'+t+'</b><br>O combate terminou. Prepare-se para a revanche.'}
function reset(){vortex.hp=nero.hp=100;vortex.energy=0;vortex.root.position.set(-2.4,0,0);nero.root.position.set(2.4,0,0);time=99;round=1;running=true;paused=false;document.querySelector('#overlay').style.display='none';document.querySelector('#round').textContent='ROUND 01 · BEST OF 3';hud();say('FIGHT!')}
document.querySelector('#start').onclick=reset;document.querySelector('#light').onpointerdown=()=>hit(vortex,nero,8);document.querySelector('#heavy').onpointerdown=()=>hit(vortex,nero,17,true);document.querySelector('#special').onpointerdown=special;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶ CONTINUAR':'Ⅱ PAUSAR';if(!paused)say('FIGHT!')};
for(const b of document.querySelectorAll('[data-m]')){const k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='j')hit(vortex,nero,8);if(e.key==='k')hit(vortex,nero,17,true);if(e.key==='l')special()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function face(a,b){a.root.rotation.y=Math.atan2(b.root.position.x-a.root.position.x,b.root.position.z-a.root.position.z)}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;clock+=dt;
if(running&&!paused){time-=dt;document.querySelector('#timer').textContent=Math.max(0,Math.ceil(time));if(time<=0)finish(vortex.hp>=nero.hp?'VORTEX VENCEU':'NERO VENCEU');
let move=(keys.right?1:0)-(keys.left?1:0);if(vortex.stun>0)vortex.stun-=dt;else vortex.root.position.x=THREE.MathUtils.clamp(vortex.root.position.x+move*vortex.speed*dt,-6.5,6.5);
if(keys.jump&&vortex.stun<=0)vortex.root.position.y=Math.max(0,Math.sin(now*.012)*.8);else vortex.root.position.y=THREE.MathUtils.lerp(vortex.root.position.y,0,dt*8);
let dx=vortex.root.position.x-nero.root.position.x,d=Math.abs(dx);if(nero.stun>0)nero.stun-=dt;else if(d>1.7)nero.root.position.x+=Math.sign(dx)*nero.speed*dt;else if(Math.random()<.035)hit(nero,vortex,Math.random()<.2?11:6,Math.random()<.2);
[vortex,nero].forEach(f=>{f.attack=Math.max(0,f.attack-dt);face(f,f===vortex?nero:vortex);f.body.position.y=Math.sin(now*.004+(f===nero?1:0))*.035;if(f===vortex){f.turbine.rotation.z+=dt*3;f.core.material.color.setHex(Math.sin(now*.008)>0?0x25eaff:0x087bba)}else{f.flame.scale.y=.8+Math.sin(now*.025)*.35;f.glove.material.color.setHex(Math.sin(now*.02)>0?0xff9a25:0xff3b1f)}});hud()}
let mid=(vortex.root.position.x+nero.root.position.x)/2;camera.position.lerp(new THREE.Vector3(mid,5.6,13.5+Math.abs(vortex.root.position.x-nero.root.position.x)*.18),1-Math.exp(-dt*3));camera.lookAt(mid,1.1,0);if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.m.position.addScaledVector(p.v,dt);p.v.y-=5*dt;if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}
renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script></body></html>
